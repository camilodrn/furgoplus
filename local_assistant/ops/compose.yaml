# Propuesta CPU 0.6B: no ejecutar en homelab sin autorización.
# Nunca combinar con infra/compose.yaml ni infra/demo/compose.yaml.
name: furgoplus-task14

services:
  ollama:
    profiles: [task14]
    image: ${TASK14_OLLAMA_IMAGE:?Define una imagen oficial revisada y fijada por digest}
    pull_policy: never
    restart: "no"
    init: true
    environment:
      # El listener global existe SOLO dentro del namespace del contenedor.
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: 60s
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_DEBUG: "false"
      OLLAMA_VULKAN: "0"
    ports:
      - "127.0.0.1:11436:11434"
    volumes:
      - models:/root/.ollama
    networks: [assistant]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    cpu_shares: 128
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    blkio_config:
      weight: 100
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

volumes:
  models: {}

networks:
  assistant:
    driver: bridge
