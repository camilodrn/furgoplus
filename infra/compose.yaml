name: furgoplus

services:
  db:
    image: postgres:17.6-alpine3.22
    env_file: ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      DB_HOST: db
    volumes:
      - ../backend:/app
      - private_uploads:/var/lib/furgoplus/private
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
  private_uploads:
  web_node_modules:

