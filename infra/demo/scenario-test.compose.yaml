# Dedicated NEW validation project only. No ports, existing volumes or production env.
name: ${SCENARIO_TEST_PROJECT:?Choose a new validation project}
services:
  db:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_USER: scenario_test
      POSTGRES_DB: furgoplus_scenario_validation
      # No test DB credentials; trust ONLY on this exclusive internal test network.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 268435456
    networks: [validation]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scenario_test -d furgoplus_scenario_validation']
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    image: ${SCENARIO_TEST_BACKEND_IMAGE:?Select a backend image with exact requirements pins}
    entrypoint: []
    command:
      - /bin/sh
      - -ec
      - >-
        python /validation/check_scenario_dependencies.py &&
        python manage.py test --settings=scenario_postgres_test_settings
        --noinput --keepdb drivers.test_demo_scenario
        api.test_demo_registration accounts.test_demo_account
        drivers.test_contact_throttle
    environment:
      PYTHONPATH: /validation:/app
      DJANGO_SETTINGS_MODULE: scenario_postgres_test_settings
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../backend:/app:ro
      - .:/validation:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    # Validation-only: avoid :Z relabel of source used by other projects on Fedora.
    security_opt: [no-new-privileges:true, label=disable]
    networks: [validation]
    mem_limit: 768m
    cpus: 1
    depends_on:
      db: {condition: service_healthy}
networks:
  validation: {internal: true}
