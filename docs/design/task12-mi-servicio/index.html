<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>FurgoPlus · Exploración de Mi servicio</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #202b3a;
        background: #f5f7fb;
        font-synthesis: none;
        --blue: #0752ac;
        --blue-dark: #06458f;
        --soft: #eaf3ff;
        --line: #d8e0eb;
        --muted: #526176;
        --green: #16643f;
        --green-soft: #e9f6ed;
        --warn: #835313;
        --warn-soft: #fff5df;
        --red: #a32735;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-size: 16px;
        line-height: 1.5;
      }
      button,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #176cdd;
        outline-offset: 3px;
      }
      a {
        color: var(--blue);
      }
      button {
        min-height: 44px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(28px, 2.6vw, 38px);
        line-height: 1.15;
        letter-spacing: -0.035em;
        font-weight: 720;
      }
      h2 {
        font-size: 21px;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }
      h3 {
        font-size: 17px;
      }
      small,
      .small {
        font-size: 14px;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        color: var(--blue);
        font-size: 13px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        font-weight: 750;
        margin-bottom: 10px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 44px;
        border: 1px solid #68788d;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 650;
        color: var(--blue);
        background: white;
        text-decoration: none;
        line-height: 1.3;
        text-align: center;
      }
      .btn.primary {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .btn.primary:hover {
        background: var(--blue-dark);
      }
      .btn.quiet {
        border-color: transparent;
        background: transparent;
        padding-inline: 8px;
      }
      .btn:hover {
        background: var(--soft);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px;
        font-size: 14px;
        font-weight: 650;
        border-radius: 6px;
        line-height: 1.35;
        background: var(--green-soft);
        color: var(--green);
      }
      .badge.neutral {
        background: var(--soft);
        color: var(--blue);
      }
      .badge.warn {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .badge.danger {
        color: var(--red);
        background: #fff0f1;
      }
      .icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .skip {
        position: absolute;
        left: 12px;
        top: -200px;
        z-index: 10;
        background: white;
        padding: 14px;
      }
      .skip:focus {
        top: 10px;
      }
      .study {
        background: #172d49;
        color: #fff;
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        font-size: 14px;
      }
      .study strong {
        font-size: 14px;
      }
      .directions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .directions a {
        color: white;
        text-decoration: none;
        padding: 9px 12px;
        border: 1px solid #71839b;
        border-radius: 6px;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .directions a[aria-current] {
        color: #172d49;
        background: white;
      }
      .study label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .study select {
        min-height: 44px;
        max-width: 100%;
        padding: 7px;
        background: #fff;
        color: #202b3a;
        border-radius: 6px;
        border: 1px solid #71839b;
      }
      .brand {
        width: 165px;
        height: auto;
        display: block;
      }
      .global-nav {
        display: grid;
        gap: 6px;
        margin-top: 32px;
      }
      .global-nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 12px 14px;
        text-decoration: none;
        color: #526176;
        border-radius: 8px;
        font-weight: 550;
      }
      .global-nav a[aria-current] {
        background: var(--soft);
        color: var(--blue);
        font-weight: 700;
      }
      .global-nav a:hover {
        background: var(--soft);
      }
      .sidebar {
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: white;
        min-height: calc(100dvh - 80px);
      }
      .sidebar-bottom {
        margin-top: auto;
        padding-top: 48px;
      }
      .sidebar-bottom .account {
        border-top: 1px solid var(--line);
        padding-top: 20px;
        margin-top: 12px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        background: var(--soft);
        color: var(--blue);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 750;
        flex: none;
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mobile-header {
        display: none;
      }
      .layout {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
      }
      .main {
        padding: 36px 40px 56px;
        min-width: 0;
        width: 100%;
        max-width: 1680px;
        margin-inline: auto;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 38px;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }
      .heading .muted {
        margin-top: 8px;
      }
      .surface {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        min-width: 0;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      .status-banner {
        padding: 26px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-left: 4px solid var(--blue);
        background: #eaf3ff;
        border-radius: 10px;
        margin-bottom: 28px;
      }
      .status-banner h2 {
        font-size: 26px;
        color: #17385e;
      }
      .status-banner p {
        margin-top: 7px;
      }
      .status-caption {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .checkmark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: white;
        color: var(--blue);
        display: grid;
        place-items: center;
        flex: none;
      }
      .status-left {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .operations {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(270px, 1fr);
        gap: 24px;
        align-items: start;
      }
      .documents {
        padding: 26px 28px;
      }
      .doc-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .doc-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 18px 0;
        border-top: 1px solid var(--line);
      }
      .doc-name {
        display: flex;
        gap: 12px;
        align-items: center;
        font-weight: 600;
      }
      .file-icon {
        width: 36px;
        height: 40px;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        border-radius: 6px;
        color: var(--muted);
        flex: none;
      }
      .doc-meta {
        font-size: 14px;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 400;
      }
      .row-tail {
        text-align: right;
        font-size: 14px;
        color: var(--green);
      }
      .row-tail time {
        color: #202b3a;
        display: block;
      }
      .documents > .btn {
        margin-top: 20px;
      }
      .data {
        padding: 26px 28px;
      }
      .data dl {
        margin: 24px 0 14px;
      }
      .data dl div {
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      dt {
        font-size: 14px;
        color: var(--muted);
      }
      dd {
        margin: 5px 0 0;
        font-weight: 550;
        overflow-wrap: anywhere;
      }
      .complete {
        color: var(--green);
        font-size: 13px;
        font-weight: 550;
      }
      .utility {
        margin-top: 24px;
        border-block: 1px solid var(--line);
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .utility-item {
        padding: 24px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .utility-item + div {
        border-left: 1px solid var(--line);
        padding-left: 28px;
      }
      .utility-item p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 4px;
      }
      .annotation {
        font-size: 13px;
        color: var(--muted);
        margin-top: 28px;
      }
      .attention {
        padding: 20px;
        border: 1px solid #bd9147;
        border-left: 4px solid #835313;
        background: var(--warn-soft);
        border-radius: 8px;
        margin-bottom: 24px;
      }
      .attention p {
        margin-top: 6px;
      }
      .attention .btn {
        margin-top: 12px;
      }
      .topnav {
        background: white;
        border-bottom: 1px solid var(--line);
        padding: 18px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .topnav .global-nav {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        gap: 2px;
      }
      .topnav .global-nav a {
        padding: 12px;
        font-size: 15px;
      }
      .topnav .global-nav .icon {
        display: none;
      }
      .b .main {
        max-width: 1400px;
        padding: 40px 56px 64px;
      }
      .b .heading {
        margin-bottom: 32px;
      }
      .b .heading h1 {
        font-size: 42px;
      }
      .b .status-banner {
        background: var(--blue);
        color: white;
        border: 0;
        border-radius: 0;
        margin: 0;
        padding: 26px 32px;
      }
      .b .status-banner h2,
      .b .status-banner .muted {
        color: white;
      }
      .b .status-banner .btn {
        border-color: white;
        background: white;
        color: var(--blue);
      }
      .b .status-banner .badge {
        background: #fff;
        color: #16643f;
      }
      .b .status-banner .badge.warn {
        color: #835313;
      }
      .folio {
        background: white;
        padding: 12px 32px 0;
      }
      .folio-section {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 36px;
        padding: 30px 0;
        border-bottom: 1px solid var(--line);
      }
      .folio-label .muted {
        margin-top: 8px;
        font-size: 14px;
      }
      .flat-data {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 32px;
        margin: 0;
      }
      .flat-data div:first-child {
        grid-column: 1/-1;
      }
      .flat-data dt {
        margin-bottom: 5px;
      }
      .folio .section-head {
        margin-bottom: 8px;
      }
      .folio .doc-row:first-child {
        border-top: 0;
      }
      .folio .doc-row {
        padding: 14px 0;
      }
      .b .utility {
        margin-top: 0;
        border: 0;
      }
      .b .utility-item {
        padding-block: 8px;
      }
      .b .annotation {
        padding-inline: 32px;
      }
      .section-index {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .section-index a {
        padding: 8px 12px;
        min-height: 44px;
        display: flex;
        align-items: center;
        color: var(--muted);
        text-decoration: none;
      }
      .section-index a:first-child {
        padding-left: 0;
      }
      .c .sidebar {
        padding-inline: 16px;
      }
      .c .layout {
        grid-template-columns: 208px minmax(0, 1fr);
      }
      .c .main {
        padding: 36px;
      }
      .c .heading {
        margin-bottom: 24px;
      }
      .compact-state {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 16px 20px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 28px;
      }
      .compact-state .primary {
        margin-left: auto;
      }
      .workbench {
        display: grid;
        grid-template-columns: 188px minmax(0, 1fr);
        gap: 28px;
      }
      .local-nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .local-nav .small {
        margin: 8px 12px 12px;
      }
      .local-nav button {
        text-align: left;
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 12px;
        color: var(--muted);
        font-weight: 550;
      }
      .local-nav button[aria-current] {
        color: var(--blue);
        background: var(--soft);
        font-weight: 750;
        border-left: 3px solid var(--blue);
      }
      .sheet {
        padding: 28px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        min-width: 0;
      }
      .sheet-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }
      .summary-split {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 30px;
        margin-top: 26px;
      }
      .summary-split .data,
      .summary-split .documents {
        padding: 0;
      }
      .summary-split .documents {
        border-left: 1px solid var(--line);
        padding-left: 28px;
      }
      .summary-split .data dl {
        margin-top: 18px;
      }
      .summary-split .doc-row {
        grid-template-columns: 1fr;
        padding: 12px 0;
        gap: 4px;
      }
      .summary-split .doc-row:first-child {
        border-top: 0;
      }
      .summary-split .row-tail {
        text-align: left;
        margin-left: 48px;
      }
      .summary-split .row-tail time {
        display: inline;
      }
      .sheet > .utility {
        margin-top: 26px;
      }
      .c .utility {
        grid-template-columns: 1fr;
      }
      .c .utility-item {
        padding: 16px 0;
      }
      .c .utility-item + div {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding-left: 0;
      }
      dialog {
        max-width: min(640px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: #202b3a;
      }
      dialog::backdrop {
        background: #172d4980;
      }
      dialog h2 {
        margin-bottom: 14px;
      }
      dialog p {
        margin-bottom: 18px;
      }
      dialog .btn {
        margin-top: 20px;
      }
      dialog .doc-row {
        grid-template-columns: 1fr auto;
      }
      dialog dl {
        margin: 0;
      }
      dialog dl div {
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      .mobile-menu {
        display: none;
      }
      #content:focus {
        outline: 0;
      }
      .noscript {
        padding: 32px;
      }
      [hidden] {
        display: none !important;
      }
      @media (min-width: 1800px) {
        .main {
          padding-inline: 56px;
        }
        .b .main {
          max-width: 1520px;
        }
      }
      @media (max-width: 1150px) {
        .operations {
          grid-template-columns: 1fr;
        }
        .summary-split {
          grid-template-columns: 1fr;
        }
        .summary-split .documents {
          padding-left: 0;
          border-left: 0;
          border-top: 1px solid var(--line);
          padding-top: 24px;
        }
        .topnav {
          flex-wrap: wrap;
        }
        .topnav > .identity {
          display: none;
        }
        .b .main {
          padding-inline: 32px;
        }
        .folio-section {
          grid-template-columns: 180px 1fr;
          gap: 24px;
        }
        .c .main {
          padding: 28px;
        }
        .workbench {
          grid-template-columns: 160px 1fr;
          gap: 20px;
        }
      }
      @media (max-width: 900px) {
        .layout,
        .c .layout {
          display: block;
        }
        .sidebar {
          display: none;
        }
        .mobile-header {
          display: flex;
          padding: 16px;
          justify-content: space-between;
          align-items: center;
          background: white;
          border-bottom: 1px solid var(--line);
        }
        .mobile-header .brand {
          width: 144px;
        }
        .mobile-menu.open {
          display: block;
          padding: 16px;
          background: white;
          border-bottom: 1px solid var(--line);
        }
        .mobile-menu .global-nav {
          margin: 0;
        }
        .main,
        .c .main {
          padding: 28px 24px;
        }
        .topline {
          margin-bottom: 28px;
        }
        .topline .identity {
          display: none;
        }
        .topnav {
          display: none;
        }
        .b .main {
          padding: 28px 24px;
        }
        .b .heading h1 {
          font-size: 34px;
        }
        .workbench {
          display: block;
        }
        .local-nav {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 4px;
          margin-bottom: 24px;
        }
        .local-nav .small {
          display: none;
        }
        .local-nav button {
          padding: 12px 8px;
        }
        .c .compact-state .primary {
          margin-left: 0;
        }
        .study {
          padding: 12px 16px;
        }
        .study > strong {
          width: 100%;
        }
      }
      @media (max-width: 600px) {
        .study {
          gap: 10px;
        }
        .study label {
          width: 100%;
          flex-wrap: wrap;
        }
        .study select {
          flex: 1;
          min-width: 0;
        }
        .directions {
          width: 100%;
        }
        .directions a {
          flex: 1;
          padding: 8px;
          justify-content: center;
          font-size: 13px;
        }
        .main,
        .c .main,
        .b .main {
          padding: 24px 16px 40px;
        }
        .heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 16px;
          margin-bottom: 22px;
        }
        .heading h1,
        .b .heading h1 {
          font-size: 30px;
        }
        .topline {
          margin-bottom: 24px;
        }
        .status-banner,
        .b .status-banner {
          padding: 22px 20px;
          display: block;
        }
        .status-banner h2 {
          font-size: 24px;
        }
        .status-banner > .btn {
          width: 100%;
          margin-top: 22px;
        }
        .status-caption {
          gap: 8px;
        }
        .status-left {
          gap: 12px;
        }
        .checkmark {
          display: none;
        }
        .operations {
          gap: 20px;
        }
        .data,
        .documents {
          padding: 22px 20px;
        }
        .doc-row {
          grid-template-columns: 1fr;
          gap: 5px;
        }
        .row-tail {
          text-align: left;
          margin-left: 48px;
        }
        .row-tail time {
          display: inline;
        }
        .section-head {
          flex-wrap: wrap;
          gap: 10px;
        }
        .utility {
          grid-template-columns: 1fr;
        }
        .utility-item {
          padding: 20px 0;
        }
        .utility-item + div {
          padding: 20px 0;
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        .utility-item {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        .utility .btn {
          padding-left: 0;
        }
        .b .status-banner {
          border-radius: 8px 8px 0 0;
        }
        .folio {
          padding-inline: 20px;
        }
        .folio-section {
          display: block;
          padding-block: 24px;
        }
        .folio-label {
          margin-bottom: 20px;
        }
        .flat-data {
          grid-template-columns: 1fr;
          gap: 18px;
        }
        .flat-data div:first-child {
          grid-column: auto;
        }
        .b .utility-item + div {
          padding-top: 20px;
        }
        .section-index {
          margin-bottom: 16px;
        }
        .b .annotation {
          padding-inline: 0;
        }
        .compact-state {
          gap: 8px;
          padding: 18px;
        }
        .compact-state .primary {
          width: 100%;
          margin-top: 8px;
        }
        .compact-state .sep {
          display: none;
        }
        .compact-state .state-pair {
          width: 100%;
        }
        .sheet {
          padding: 22px 20px;
        }
        .sheet-top {
          flex-wrap: wrap;
        }
        .local-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .summary-split {
          gap: 22px;
        }
        .c .utility-item {
          flex-direction: column;
          align-items: flex-start;
        }
        .annotation {
          margin-top: 24px;
        }
        dialog .doc-row {
          grid-template-columns: 1fr;
        }
        .doc-name {
          align-items: flex-start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto;
        }
      }
      .status-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-shrink: 0;
        max-width: 290px;
      }
      .compact-state .status-actions {
        margin-left: auto;
      }
      @media (max-width: 600px) {
        .status-actions {
          max-width: none;
          width: 100%;
          margin-top: 20px;
        }
        .compact-state .status-actions {
          margin-left: 0;
          margin-top: 10px;
        }
        .status-actions .btn {
          width: 100%;
        }
      }
      .account-menu {
        position: relative;
      }
      .account-menu summary {
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .account-menu > div {
        position: absolute;
        right: 0;
        top: 55px;
        z-index: 4;
        min-width: 190px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 8px 24px #172d491a;
      }
      .account-menu .btn {
        display: flex;
        width: 100%;
        justify-content: flex-start;
      }
    </style>

          "M7 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6M2 17v-2a4 4 0 0 1 8 0v2M13 5a3 3 0 0 1 0 6M13 13a4 4 0 0 1 5 4",
        request: "M3 4h14v10H9l-5 4v-4H3zM6 8h8",
        payment: "M2 5h16v12H2zM2 9h16M5 13h3",
        report: "M4 17V9M10 17V3M16 17v-6M2 18h16",
        help: "M7 7a3 3 0 0 1 6 0c0 2-3 2-3 4M10 15h.01M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18",
        check: "m4 10 4 4 8-8",
        file: "M5 2h7l4 4v12H5zM12 2v5h4M8 11h5M8 14h5",
      };
      const icon = (n) =>
        `<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="${paths[n] || paths.file}"/></svg>`;
      const fixture = Object.freeze({
        name: "Servicio académico",
        description: "Traslados escolares",
        email: "servicio@example.test",
        expiry: "31/12/2026",
        iso: "2026-12-31",
      });
      const direction = ["a", "b", "c"].includes(
        new URLSearchParams(location.search).get("direction"),
      )
        ? new URLSearchParams(location.search).get("direction")
        : "a";
      let state = "approved",
        pane = "summary";
      const actions = {
        approved: ["Consultar publicación", "publication"],
        notvisible: ["Consultar publicación", "publication"],
        unknown: ["Consultar publicación", "publication"],
        pending: ["Ver revisión", "validation"],
        rejected: ["Revisar cambios solicitados", "validation"],
        draft: ["Completar datos del servicio", "profile"],
        expired: ["Actualizar documentos", "documents"],
        suspended: ["Consultar publicación", "publication"],
      };
      const headings = {
        approved: "Mi servicio",
        notvisible: "Mi servicio",
        unknown: "Mi servicio",
        pending: "Tu información está en revisión",
        rejected: "Revisa los cambios solicitados",
        draft: "Prepara tu información",
        expired: "Mi servicio",
        suspended: "Mi servicio",
      };
      const reviews = {
        approved: "Aprobado",
        notvisible: "Aprobado",
        unknown: "Aprobado",
        pending: "En revisión",
        rejected: "Requiere cambios",
        draft: "Sin enviar",
        expired: "Aprobado",
        suspended: "Aprobado",
      };
      const visibility = () =>
        state === "unknown"
          ? "Sin confirmar"
          : state === "approved"
            ? "Visible para apoderados"
            : state === "notvisible"
              ? "No visible · sin solicitar"
              : "No visible · publicación solicitada";
      const btn = (label, target, style = "") =>
        `<button type="button" class="btn ${style}" data-action="${target}">${label}${style === "primary" ? '<span aria-hidden="true">→</span>' : ""}</button>`;
      const primary = () => btn(...actions[state], "primary");
      const badge = (text, kind = "") =>
        `<span class="badge ${kind}">${text}</span>`;
      function nav() {
        return `<nav class="global-nav" aria-label="Secciones del conductor">${[
          ["Inicio", "home"],
          ["Mi servicio", "service"],
          ["Pasajeros", "people"],
          ["Solicitudes", "request"],
          ["Pagos", "payment"],
          ["Plan y reportes", "report"],
        ]
          .map(
            ([label, i]) =>
              `<a href="#content" ${i === "service" ? 'aria-current="page"' : 'data-global="' + label + '"'}>${icon(i)}${label}</a>`,
          )
          .join("")}</nav>`;
      }
      const identity = () =>
        `<div class="identity"><span class="avatar" aria-hidden="true">SA</span><div><strong class="small">Servicio académico</strong><div class="small muted">Conductor</div></div></div>`;
      const logo = () => `<img class="brand" src="${LOGO}" alt="FurgoPlus">`;
      const shellStart = () =>
        `${direction === "b" ? `<header class="topnav">${logo()}${nav()}<details class="account-menu"><summary aria-label="Opciones de la cuenta">${identity()}</summary><div>${btn("Ayuda y soporte", "help", "quiet")}${btn("Cerrar sesión", "logout", "quiet")}</div></details></header>` : ""}<header class="mobile-header">${logo()}<button class="btn" id="menu" aria-expanded="false" aria-controls="mobile-menu">Menú</button></header><div class="mobile-menu" id="mobile-menu">${nav()}${btn("Ayuda y soporte", "help", "quiet")}${btn("Cerrar sesión", "logout", "quiet")}</div><div class="${direction === "b" ? "" : "layout"}">${direction === "b" ? "" : `<aside class="sidebar">${logo()}<p class="small muted" style="margin-top:10px">Transporte escolar</p>${nav()}<div class="sidebar-bottom">${btn("Ayuda y soporte", "help", "quiet")}<div class="account">${identity()}${btn("Cerrar sesión", "logout", "quiet")}</div></div></aside>`}<main class="main" id="content" tabindex="-1"><div class="topline"><span>Tu espacio de trabajo <span aria-hidden="true">/</span> <strong>Mi servicio</strong></span>${direction === "b" ? "" : identity()}</div>`;
      function status(compact = false) {
        const statusActions = `<div class="status-actions">${primary()}${actions[state][1] !== "publication" ? btn("Consultar publicación", "publication", "quiet") : ""}</div>`;
        const review = badge(
          reviews[state],
          ["pending", "rejected", "draft"].includes(state) ? "warn" : "",
        );
        if (compact)
          return `<section class="compact-state" aria-label="Estado del servicio"><span class="state-pair"><span class="small muted">Publicación </span>${badge(visibility(), state === "approved" ? "" : "neutral")}</span><span class="sep muted" aria-hidden="true">·</span><span class="state-pair"><span class="small muted">Revisión </span>${review}</span>${statusActions}</section>`;
        return `<section class="status-banner" aria-label="Estado del servicio"><div class="status-left"><span class="checkmark">${icon(state === "approved" ? "check" : "service")}</span><div><p class="small" style="margin:0 0 6px">Publicación</p><h2>${visibility()}</h2><div class="status-caption"><span class="small">Revisión de información</span>${review}</div></div></div>${statusActions}</section>`;
      }
      function attention() {
        if (!["expired", "suspended", "rejected", "draft"].includes(state))
          return "";
        const texts = {
          expired: [
            "Requiere atención",
            "Credencial vencida. Actualiza el documento para revisar la publicación.",
            "Actualizar documentos",
            "documents",
          ],
          suspended: [
            "Servicio suspendido",
            "La suspensión es independiente de la revisión aprobada. Consulta el estado de publicación.",
            "Consultar publicación",
            "publication",
          ],
          rejected: [
            "Cambios solicitados",
            "Consulta las observaciones antes de corregir y volver a enviar.",
            "Ver observaciones",
            "validation",
          ],
          draft: [
            "Faltan datos del servicio",
            "Completa la descripción para continuar con la revisión.",
            "Completar datos",
            "profile",
          ],
        };
        const [title, copy, label, target] = texts[state];
        return `<section class="attention" aria-label="Acciones necesarias"><h2>${title}</h2><p>${copy}</p>${target !== actions[state][1] ? btn(label, target) : ""}</section>`;
      }
      function data() {
        return `<section class="data" aria-label="Datos del servicio"><div class="section-head"><h2>Datos del servicio</h2>${badge(state === "draft" ? "1 pendiente" : "Completos", state === "draft" ? "warn" : "")}</div><dl>${dataRows()}</dl>${btn("Editar datos", "profile", "quiet")}</section>`;
      }
      function dataRows() {
        return [
          ["Nombre", fixture.name],
          [
            "Descripción",
            state === "draft" ? "Pendiente" : fixture.description,
          ],
          ["Correo de contacto", fixture.email],
        ]
          .map(
            ([key, value]) =>
              `<div><dt>${key} <span class="complete">${value === "Pendiente" ? "· Pendiente" : "· Completado"}</span></dt><dd>${value}</dd></div>`,
          )
          .join("");
      }
      function docs() {
        return `<section class="documents" aria-label="Documentos"><div class="section-head"><h2>Documentos</h2><span class="small muted">3 de 3 cargados</span></div>${docRows()}${btn("Revisar documentos", "documents")}</section>`;
      }
      function docRows() {
        return `<ul class="doc-list">${["Identidad", "Vehículo", "Credencial"].map((name, i) => `<li class="doc-row"><div class="doc-name"><span class="file-icon">${icon("file")}</span><div>${name}<div class="doc-meta">${i === 2 ? "Con fecha de vencimiento" : "Sin vencimiento requerido"}</div></div></div><div class="row-tail">${i === 2 ? `${state === "expired" ? '<span style="color:var(--red)">Vencido · </span>' : "Vence "}<time datetime="${state === "expired" ? "2026-10-01" : fixture.iso}">${state === "expired" ? "01/10/2026" : fixture.expiry}</time>` : "Cargado"}</div></li>`).join("")}</ul>`;
      }
      const utility = () =>
        `<div class="utility"><div class="utility-item"><div><h3>Revisión e historial</h3><p>Consulta el resultado y tus envíos.</p></div>${btn("Ver revisión", "validation", "quiet")}</div><div class="utility-item"><div><h3>Rutas</h3><p>Gestiona tus recorridos y cobertura.</p></div>${btn("Ver rutas", "routes", "quiet")}</div></div>`;
      function heading() {
        return `<header class="heading"><div><p class="eyebrow">${direction === "b" ? "Mi servicio" : "Gestión del servicio"}</p><h1>${direction === "b" && state === "approved" ? fixture.name : headings[state]}</h1><p class="muted">${direction === "b" ? fixture.description : fixture.name}</p></div>${direction === "b" ? btn("Editar datos", "profile") : ""}</header>`;
      }
      const annotation = () =>
        `<p class="annotation">Propuesta ${direction.toUpperCase()} · Los datos y las acciones son una simulación local basada en las pruebas existentes.</p>`;
      function render() {
        document.body.className = direction;
        document.querySelectorAll("[data-direction]").forEach((a) => {
          if (a.dataset.direction === direction)
            a.setAttribute("aria-current", "page");
        });
        let body = "";
        if (direction === "a") {
          body =
            heading() +
            status() +
            attention() +
            `<div class="operations"><div class="surface">${docs()}</div><div class="surface">${data()}</div></div>` +
            utility();
        } else if (direction === "b") {
          body =
            heading() +
            `<nav class="section-index" aria-label="Contenido de la ficha"><a href="#data">Datos del servicio</a><a href="#documents">Documentos</a><a href="#access">Revisión y rutas</a></nav>` +
            status() +
            attention() +
            `<div class="folio"><section class="folio-section" id="data"><div class="folio-label"><h2>Datos del servicio</h2><p class="muted">${state === "draft" ? "Una tarea pendiente" : "Información completada"}</p></div><dl class="flat-data">${dataRows()}</dl></section><section class="folio-section" id="documents"><div class="folio-label"><h2>Documentos</h2><p class="muted">3 de 3 cargados</p>${btn("Revisar documentos", "documents", "quiet")}</div>${docRows()}</section><section class="folio-section" id="access"><div class="folio-label"><h2>Gestión</h2><p class="muted">Accesos del servicio</p></div>${utility()}</section></div>`;
        } else {
          body =
            heading() +
            status(true) +
            attention() +
            `<div class="workbench"><nav class="local-nav" aria-label="Secciones de Mi servicio"><p class="small muted">MI SERVICIO</p>${[
              ["summary", "Resumen"],
              ["profile", "Datos del servicio"],
              ["documents", "Documentos"],
              ["validation", "Revisión e historial"],
              ["publication", "Publicación"],
              ["routes", "Rutas"],
            ]
              .map(
                ([id, label]) =>
                  `<button data-pane="${id}" ${pane === id ? 'aria-current="page"' : ""}>${label}</button>`,
              )
              .join(
                "",
              )}</nav><section class="sheet" aria-labelledby="sheet-title">${pane === "summary" ? `<div class="sheet-top"><h2 id="sheet-title">Resumen del servicio</h2><span class="small muted">Información y accesos</span></div><div class="summary-split">${data()}${docs()}</div>${utility()}` : `<div class="sheet-top"><h2 id="sheet-title" tabindex="-1">${titles[pane]}</h2><button class="btn quiet" data-pane="summary">Volver al resumen</button></div><div style="margin-top:24px">${detailContent(pane)}</div>`}</section></div>`;
        }
        document.getElementById("preview").innerHTML =
          shellStart() + body + annotation() + "</main></div>";
        bind();
      }
      const titles = {
        profile: "Datos del servicio",
        documents: "Documentos",
        validation: "Revisión e historial",
        publication: "Publicación",
        routes: "Rutas",
        help: "Ayuda y soporte",
        logout: "Cerrar sesión",
      };
      function detailContent(target) {
        const note =
          '<p class="small muted" style="margin-top:20px">Vista conceptual. La pantalla existente y sus reglas se conservarían al implementar la dirección elegida.</p>';
        if (target === "profile") return "<dl>" + dataRows() + "</dl>" + note;
        if (target === "documents") return docRows() + note;
        if (target === "validation")
          return (
            `<p>Revisión de información: <strong>${reviews[state]}</strong></p><p>El historial se abriría en el destino existente.</p>` +
            note
          );
        if (target === "publication")
          return (
            `<p>Publicación: <strong>${visibility()}</strong></p><p>Revisión de información: <strong>${reviews[state]}</strong></p><p>La intención de publicar y los bloqueos conservan sus reglas actuales.</p>` +
            note
          );
        return (
          "<p>Este acceso abriría la pantalla existente. La exploración no carga ni guarda datos.</p>" +
          note
        );
      }
      function openDetail(target, label) {
        document.getElementById("detail-title").textContent =
          label || titles[target] || target;
        document.getElementById("detail-content").innerHTML =
          detailContent(target);
        document.getElementById("detail").showModal();
      }
      function bind() {
        document.querySelectorAll("[data-action]").forEach(
          (el) =>
            (el.onclick = () => {
              if (
                direction === "c" &&
                [
                  "profile",
                  "documents",
                  "validation",
                  "publication",
                  "routes",
                ].includes(el.dataset.action)
              ) {
                pane = el.dataset.action;
                render();
                document.getElementById("sheet-title")?.focus();
              } else openDetail(el.dataset.action);
            }),
        );
        document.querySelectorAll("[data-global]").forEach(
          (el) =>
            (el.onclick = (e) => {
              e.preventDefault();
              openDetail("global", el.dataset.global);
            }),
        );
        document.querySelectorAll("[data-pane]").forEach(
          (el) =>
            (el.onclick = () => {
              pane = el.dataset.pane;
              render();
              const h = document.getElementById("sheet-title");
              h.setAttribute("tabindex", "-1");
              h.focus();
            }),
        );
        const menu = document.getElementById("menu");
        menu.onclick = () => {
          const open = menu.getAttribute("aria-expanded") !== "true";
          menu.setAttribute("aria-expanded", String(open));
          document.getElementById("mobile-menu").classList.toggle("open", open);
        };
      }
      document.getElementById("scenario").onchange = (e) => {
        state = e.target.value;
        pane = "summary";
        render();
      };
      document.getElementById("close-dialog").onclick = () =>
        document.getElementById("detail").close();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const m = document.getElementById("menu");
          if (m?.getAttribute("aria-expanded") === "true") {
            m.setAttribute("aria-expanded", "false");
            document.getElementById("mobile-menu").classList.remove("open");
            m.focus();
          }
        }
      });
      render();
    </script>
  </body>
</html>
